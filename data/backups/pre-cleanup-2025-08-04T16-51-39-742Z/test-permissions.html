<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permission Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .pass { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .fail { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { margin: 5px; padding: 10px 15px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Case Workflow Permissions Test</h1>
    
    <div id="results"></div>
    
    <h2>Test Actions</h2>
    <button onclick="testPermissions()">Test All Role Permissions</button>
    <button onclick="testStatusUpdates()">Test Status Updates</button>
    
    <script>
        const roles = ['lead1', 'manager1', 'admin1', 'ops1', 'ops2'];
        const expectedPermissions = {
            'lead1': ['read'],
            'manager1': ['read', 'update_status'],
            'admin1': ['read', 'update_status', 'create', 'delete', 'assign'],
            'ops1': ['read', 'update_status', 'create', 'assign'],
            'ops2': ['read', 'update_status', 'create', 'assign']
        };
        
        function addResult(message, isPass, isInfo = false) {
            const resultsDiv = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${isInfo ? 'info' : (isPass ? 'pass' : 'fail')}`;
            div.textContent = message;
            resultsDiv.appendChild(div);
        }
        
        async function testPermissions() {
            addResult('Starting permission tests...', true, true);
            
            for (const roleId of roles) {
                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: roleId })
                    });
                    
                    if (response.ok) {
                        const user = await response.json();
                        const expected = expectedPermissions[roleId];
                        const actual = user.permissions;
                        
                        const hasCorrectPermissions = expected.every(p => actual.includes(p)) && 
                                                    actual.every(p => expected.includes(p));
                        
                        addResult(
                            `${user.name} (${user.role}): Expected [${expected.join(', ')}], Got [${actual.join(', ')}]`,
                            hasCorrectPermissions
                        );
                        
                        // Test specific update_status permission
                        const hasUpdateStatus = actual.includes('update_status');
                        const shouldHaveUpdateStatus = ['manager1', 'admin1', 'ops1', 'ops2'].includes(roleId);
                        
                        addResult(
                            `${user.name} update_status permission: ${hasUpdateStatus ? 'YES' : 'NO'} (should be ${shouldHaveUpdateStatus ? 'YES' : 'NO'})`,
                            hasUpdateStatus === shouldHaveUpdateStatus
                        );
                    } else {
                        addResult(`Failed to login as ${roleId}`, false);
                    }
                } catch (error) {
                    addResult(`Error testing ${roleId}: ${error.message}`, false);
                }
            }
        }
        
        async function testStatusUpdates() {
            addResult('Testing status update functionality...', true, true);
            
            // Test with a manager account
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: 'manager1' })
                });
                
                if (response.ok) {
                    const user = await response.json();
                    addResult(`Logged in as ${user.name} with permissions: [${user.permissions.join(', ')}]`, true, true);
                    
                    // Try to update case status
                    const updateResponse = await fetch('/api/cases/1', {
                        method: 'PUT',
                        headers: { 
                            'Content-Type': 'application/json',
                            'X-User-Id': 'manager1'
                        },
                        body: JSON.stringify({
                            title: 'Test Case',
                            description: 'Test description',
                            status: 'Assigned',
                            priority: 'Medium',
                            assignedTo: 'Sarah Ops'
                        })
                    });
                    
                    if (updateResponse.ok) {
                        addResult('Manager can successfully update case status', true);
                    } else {
                        const error = await updateResponse.text();
                        addResult(`Manager status update failed: ${error}`, false);
                    }
                } else {
                    addResult('Failed to login as manager', false);
                }
            } catch (error) {
                addResult(`Error testing status updates: ${error.message}`, false);
            }
        }
        
        // Run basic test on page load
        window.onload = () => {
            addResult('Permission test page loaded. Click buttons to run tests.', true, true);
        };
    </script>
</body>
</html>
