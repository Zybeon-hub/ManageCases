<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Workflow Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Authentication Check -->
        <div id="auth-check" class="login-section">
            <div class="login-card">
                <h2>Case Workflow Management System</h2>
                <p>Checking authentication...</p>
                <div style="text-align: center; margin-top: 2rem;">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <!-- Main Application -->
        <div id="app-section" class="hidden">
        <header>
            <div class="header-left">
                <h1>Case Workflow Management System</h1>
                <div class="user-info-header">
                    <span id="current-user-name"></span> - <span id="current-user-role"></span>
                    <button id="logout-btn" class="btn-secondary">Logout</button>
                </div>
            </div>
            <div class="header-actions">
                <button id="manage-users-btn" class="btn-secondary hidden">Manage Users</button>
                <button id="new-case-btn" class="btn-primary hidden">+ New Case</button>
            </div>
        </header>

        <!-- Filters Section -->
        <div class="filters">
            <div class="filter-group">
                <label for="status-filter">Status:</label>
                <select id="status-filter">
                    <option value="All">All</option>
                    <option value="Open">Open</option>
                    <option value="Assigned">Assigned</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Stage 1 Investigation">Stage 1 Investigation</option>
                    <option value="Stage 2 Investigation">Stage 2 Investigation</option>
                    <option value="Stage 3 Investigation">Stage 3 Investigation</option>
                    <option value="Closed-Approved">Closed-Approved</option>
                    <option value="Hold">Hold</option>
                    <option value="Closed-Reject">Closed-Reject</option>
                    <option value="Reopen">Reopen</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="priority-filter">Priority:</label>
                <select id="priority-filter">
                    <option value="All">All</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="assignee-filter">Assigned To:</label>
                <select id="assignee-filter">
                    <option value="All">All</option>
                    <option value="Unassigned">Unassigned</option>
                    <!-- Users will be loaded dynamically -->
                </select>
            </div>
            <button id="refresh-btn" class="btn-secondary">Refresh</button>
        </div>

        <!-- Cases List -->
        <div class="cases-section">
            <h2>Cases</h2>
            <div id="cases-container" class="cases-grid">
                <!-- Cases will be loaded here -->
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="loading hidden">Loading...</div>
    </div>

    <!-- Modal for New/Edit Case -->
    <div id="case-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">New Case</h3>
                <span class="close">&times;</span>
            </div>
            <form id="case-form">
                <div class="form-group">
                    <label for="case-title">Title *</label>
                    <input type="text" id="case-title" required>
                </div>
                <div class="form-group">
                    <label for="case-description">Description *</label>
                    <textarea id="case-description" rows="4" required></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="case-priority">Priority</label>
                        <select id="case-priority">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="case-assignee">Assigned To</label>
                        <select id="case-assignee">
                            <option value="Unassigned">Unassigned</option>
                            <!-- Users will be loaded dynamically -->
                        </select>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" id="cancel-btn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Save Case</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for Case Details -->
    <div id="details-modal" class="modal hidden">
        <div class="modal-content large">
            <div class="modal-header">
                <h3 id="details-title">Case Details</h3>
                <span class="close">&times;</span>
            </div>
            <div id="case-details">
                <!-- Case details will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Modal for User Management -->
    <div id="user-modal" class="modal hidden">
        <div class="modal-content large">
            <div class="modal-header">
                <h3 id="user-modal-title">Manage Users</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <div class="user-management-actions">
                    <button id="add-user-btn" class="btn-primary">+ Add New User</button>
                    <button id="refresh-users-btn" class="btn-secondary">Refresh</button>
                </div>
                <div id="users-list">
                    <!-- Users will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Add/Edit User -->
    <div id="user-form-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="user-form-title">Add New User</h3>
                <span class="close">&times;</span>
            </div>
            <form id="user-form">
                <div class="form-group">
                    <label for="user-username">Username *</label>
                    <input type="text" id="user-username" required>
                </div>
                <div class="form-group">
                    <label for="user-name">Full Name *</label>
                    <input type="text" id="user-name" required>
                </div>
                <div class="form-group">
                    <label for="user-email">Email *</label>
                    <input type="email" id="user-email" required>
                </div>
                <div class="form-group">
                    <label for="user-role">Role *</label>
                    <select id="user-role" required>
                        <option value="">Select Role</option>
                        <option value="ADMIN">Admin</option>
                        <option value="MANAGER">Manager</option>
                        <option value="LEAD">Lead</option>
                        <option value="OPS">Ops</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="user-password">Password *</label>
                    <input type="password" id="user-password" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary close">Cancel</button>
                    <button type="submit" class="btn-primary">Save User</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <script>
        console.log("Case Workflow App loading...");
        
        class CaseWorkflowApp {
            constructor() {
                this.cases = [];
                this.currentUser = null;
                this.userPermissions = [];
                this.allowedStatuses = [];
                this.currentEditingCase = null;
                this.workflowInfo = null;
                this.init();
            }

            init() {
                console.log('App initializing...');
                this.setupEventListeners();
                setTimeout(() => {
                    this.checkAuthentication();
                }, 100);
            }

            checkAuthentication() {
                console.log('Checking authentication...');
                const sessionToken = localStorage.getItem('sessionToken');
                const currentUser = localStorage.getItem('currentUser');
                const userPermissions = localStorage.getItem('userPermissions');
                
                if (sessionToken && currentUser && userPermissions) {
                    try {
                        this.currentUser = JSON.parse(currentUser);
                        this.userPermissions = JSON.parse(userPermissions);
                        console.log('Found stored authentication, loading app...');
                        this.loadApp();
                    } catch (error) {
                        console.error('Error parsing stored user data:', error);
                        this.redirectToLogin();
                    }
                } else {
                    console.log('No authentication found, redirecting to login...');
                    this.redirectToLogin();
                }
            }
            
            redirectToLogin() {
                // Clear any invalid stored data
                localStorage.removeItem('sessionToken');
                localStorage.removeItem('currentUser');
                localStorage.removeItem('userPermissions');
                
                // Redirect to login page
                window.location.href = '/login.html';
            }
            
            async loadApp() {
                // Verify the session is still valid
                try {
                    const response = await this.makeAuthenticatedRequest('/api/auth/user');
                    if (!response.ok) {
                        console.log('Session invalid, redirecting to login...');
                        this.redirectToLogin();
                        return;
                    }
                    
                    // Load workflow information
                    await this.loadWorkflowInfo();
                    
                    // Load users for dropdowns
                    await this.loadUsers();
                    
                    // Update UI
                    document.getElementById('current-user-name').textContent = this.currentUser.name;
                    document.getElementById('current-user-role').textContent = this.currentUser.role;
                    
                    // Show/hide buttons based on permissions
                    this.updateUIForPermissions();
                    
                    this.showAppScreen();
                    this.loadCases();
                    console.log('App loaded successfully for user:', this.currentUser.name);
                } catch (error) {
                    console.error('Error loading app:', error);
                    this.redirectToLogin();
                }
            }

            showLoginScreen() {
                // This method is now obsolete but kept for compatibility
                this.redirectToLogin();
            }

            showAppScreen() {
                const authCheck = document.getElementById('auth-check');
                const appSection = document.getElementById('app-section');
                
                if (authCheck) {
                    authCheck.classList.add('hidden');
                    authCheck.style.display = 'none';
                }
                if (appSection) {
                    appSection.classList.remove('hidden');
                    appSection.style.display = 'block';
                }
            }

            setupEventListeners() {
                console.log('Setting up event listeners...');
                
                setTimeout(() => {
                    // Logout button
                    const logoutBtn = document.getElementById('logout-btn');
                    if (logoutBtn) {
                        logoutBtn.addEventListener('click', () => this.logout());
                    }

                    // New case button
                    const newCaseBtn = document.getElementById('new-case-btn');
                    if (newCaseBtn) {
                        newCaseBtn.addEventListener('click', () => {
                            if (this.hasPermission('create')) {
                                this.openNewCaseModal();
                            } else {
                                this.showToast('You do not have permission to create cases', 'error');
                            }
                        });
                    }

                    // Manage users button (admin only)
                    const manageUsersBtn = document.getElementById('manage-users-btn');
                    if (manageUsersBtn) {
                        manageUsersBtn.addEventListener('click', () => {
                            console.log('Manage users button clicked');
                            this.showUserManagement();
                        });
                    }

                    // Filter change events
                    const statusFilter = document.getElementById('status-filter');
                    const priorityFilter = document.getElementById('priority-filter');
                    const assigneeFilter = document.getElementById('assignee-filter');
                    const refreshBtn = document.getElementById('refresh-btn');

                    if (statusFilter) statusFilter.addEventListener('change', () => this.loadCases());
                    if (priorityFilter) priorityFilter.addEventListener('change', () => this.loadCases());
                    if (assigneeFilter) assigneeFilter.addEventListener('change', () => this.loadCases());
                    if (refreshBtn) refreshBtn.addEventListener('click', () => this.loadCases());

                    // Modal close buttons
                    document.querySelectorAll('.close').forEach(closeBtn => {
                        closeBtn.addEventListener('click', (e) => {
                            this.closeModal(e.target.closest('.modal'));
                        });
                    });

                    // Modal backdrop click
                    document.querySelectorAll('.modal').forEach(modal => {
                        modal.addEventListener('click', (e) => {
                            if (e.target === modal) {
                                this.closeModal(modal);
                            }
                        });
                    });

                    // Case form submission
                    const caseForm = document.getElementById('case-form');
                    if (caseForm) {
                        caseForm.addEventListener('submit', (e) => {
                            e.preventDefault();
                            this.submitCaseForm();
                        });
                    }

                    // Cancel button
                    const cancelBtn = document.getElementById('cancel-btn');
                    if (cancelBtn) {
                        cancelBtn.addEventListener('click', () => {
                            this.closeModal(document.getElementById('case-modal'));
                        });
                    }

                    // User management buttons
                    const addUserBtn = document.getElementById('add-user-btn');
                    if (addUserBtn) {
                        addUserBtn.addEventListener('click', () => {
                            this.openNewUserModal();
                        });
                    }

                    const refreshUsersBtn = document.getElementById('refresh-users-btn');
                    if (refreshUsersBtn) {
                        refreshUsersBtn.addEventListener('click', () => {
                            this.loadAndDisplayUsers();
                        });
                    }

                    // User form submission
                    const userForm = document.getElementById('user-form');
                    if (userForm) {
                        userForm.addEventListener('submit', (e) => {
                            e.preventDefault();
                            this.saveUser();
                        });
                    }
                }, 200);
            }

            async loadWorkflowInfo() {
                try {
                    const response = await this.makeAuthenticatedRequest('/api/workflow');
                    if (response.ok) {
                        this.workflowInfo = await response.json();
                        console.log('Workflow info loaded:', this.workflowInfo);
                    } else {
                        console.error('Failed to load workflow info');
                    }
                } catch (error) {
                    console.error('Error loading workflow info:', error);
                }
            }

            logout() {
                // Clear all authentication data
                localStorage.removeItem('sessionToken');
                localStorage.removeItem('currentUser');
                localStorage.removeItem('userPermissions');
                
                this.currentUser = null;
                this.userPermissions = [];
                this.cases = [];
                
                this.showToast('Logged out successfully', 'info');
                
                // Redirect to login page
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 1000);
            }

            hasPermission(permission) {
                return this.userPermissions.includes(permission);
            }

            updateUIForPermissions() {
                console.log('updateUIForPermissions called (index.html version)');
                console.log('Current user:', this.currentUser);
                console.log('User role:', this.currentUser?.role);
                
                // Show/hide new case button
                const newCaseBtn = document.getElementById('new-case-btn');
                if (newCaseBtn) {
                    if (this.hasPermission('create')) {
                        newCaseBtn.classList.remove('hidden');
                        console.log('Showing new case button');
                    } else {
                        newCaseBtn.classList.add('hidden');
                        console.log('Hiding new case button');
                    }
                }
                
                // Show/hide manage users button (admin only)
                const manageUsersBtn = document.getElementById('manage-users-btn');
                console.log('Manage users button element:', manageUsersBtn);
                
                if (this.currentUser && (this.currentUser.role === 'admin' || this.currentUser.role === 'ADMIN')) {
                    console.log('✅ User is admin, showing manage users button');
                    if (manageUsersBtn) {
                        manageUsersBtn.classList.remove('hidden');
                        console.log('✅ Removed hidden class from manage users button');
                    } else {
                        console.log('❌ Manage users button element not found');
                    }
                } else {
                    console.log('❌ User is not admin, hiding manage users button');
                    console.log('Role check details:');
                    console.log('- currentUser exists:', !!this.currentUser);
                    console.log('- role === "admin":', this.currentUser ? this.currentUser.role === 'admin' : false);
                    console.log('- role === "ADMIN":', this.currentUser ? this.currentUser.role === 'ADMIN' : false);
                    if (manageUsersBtn) {
                        manageUsersBtn.classList.add('hidden');
                    }
                }
            }

            async makeAuthenticatedRequest(url, options = {}) {
                return fetch(url, {
                    ...options,
                    headers: {
                        ...options.headers,
                        'X-Username': this.currentUser?.username || 'admin'
                    }
                });
            }

            async loadCases() {
                if (!this.currentUser) return;
                
                this.showLoading(true);
                
                try {
                    const status = document.getElementById('status-filter').value;
                    const priority = document.getElementById('priority-filter').value;
                    const assignedTo = document.getElementById('assignee-filter').value;

                    const params = new URLSearchParams();
                    if (status !== 'All') params.append('status', status);
                    if (priority !== 'All') params.append('priority', priority);
                    if (assignedTo !== 'All') params.append('assignedTo', assignedTo);

                    const response = await this.makeAuthenticatedRequest(`/api/cases?${params}`);
                    
                    if (response.ok) {
                        this.cases = await response.json();
                        this.renderCases();
                    } else {
                        throw new Error('Failed to load cases');
                    }
                } catch (error) {
                    this.showToast('Error loading cases: ' + error.message, 'error');
                    console.error('Error loading cases:', error);
                } finally {
                    this.showLoading(false);
                }
            }

            renderCases() {
                const container = document.getElementById('cases-container');
                
                if (this.cases.length === 0) {
                    container.innerHTML = '<div class="no-cases">No cases found matching the current filters.</div>';
                    return;
                }

                container.innerHTML = this.cases.map(caseItem => this.createCaseCard(caseItem)).join('');
            }

            createCaseCard(caseItem) {
                const formattedDate = new Date(caseItem.updatedAt).toLocaleDateString();
                const statusClass = caseItem.status.toLowerCase().replace(/\s+/g, '-');
                const priorityClass = caseItem.priority.toLowerCase();

                // Determine which actions are available
                const canEdit = this.hasPermission('update_status') || this.currentUser.role === 'ADMIN';
                const canDelete = this.hasPermission('delete');

                let actionsHtml = '';
                if (canEdit) {
                    actionsHtml += `<button class="btn-secondary" onclick="app.editCase(${caseItem.id})">Edit</button>`;
                }
                if (canDelete) {
                    actionsHtml += `<button class="btn-danger" onclick="app.deleteCase(${caseItem.id})">Delete</button>`;
                }

                return `
                    <div class="case-card" data-case-id="${caseItem.id}">
                        <div class="case-header">
                            <div>
                                <div class="case-title">${this.escapeHtml(caseItem.title)}</div>
                                <div class="case-id">Case #${caseItem.id}</div>
                            </div>
                            <div class="case-actions">
                                ${actionsHtml}
                            </div>
                        </div>
                        <div class="case-description">${this.escapeHtml(caseItem.description)}</div>
                        <div class="case-meta">
                            <div>
                                <span class="status-badge status-${statusClass}">${caseItem.status}</span>
                                <span class="priority-badge priority-${priorityClass}">${caseItem.priority}</span>
                            </div>
                            <div>Updated: ${formattedDate}</div>
                        </div>
                        <div class="case-assignee">
                            <strong>Assigned to:</strong> ${this.escapeHtml(caseItem.assignedTo)}
                        </div>
                        <div style="margin-top: 10px;">
                            <button class="btn-primary" onclick="app.viewCaseDetails(${caseItem.id})">View Details</button>
                        </div>
                    </div>
                `;
            }

            openNewCaseModal() {
                this.currentEditingCase = null;
                document.getElementById('modal-title').textContent = 'New Case';
                document.getElementById('case-form').reset();
                
                // Remove any existing status field from previous edit
                const existingStatusField = document.getElementById('case-status');
                if (existingStatusField) {
                    existingStatusField.closest('.form-group').remove();
                }
                
                this.showModal(document.getElementById('case-modal'));
            }

            async editCase(caseId) {
                try {
                    const response = await this.makeAuthenticatedRequest(`/api/cases/${caseId}`);
                    
                    if (response.ok) {
                        const caseItem = await response.json();
                        
                        this.currentEditingCase = caseItem;
                        document.getElementById('modal-title').textContent = 'Edit Case';
                        document.getElementById('case-title').value = caseItem.title;
                        document.getElementById('case-description').value = caseItem.description;
                        document.getElementById('case-priority').value = caseItem.priority;
                        document.getElementById('case-assignee').value = caseItem.assignedTo;
                        
                        // Add status field if user can update status
                        this.updateEditFormForPermissions(caseItem);
                        
                        this.showModal(document.getElementById('case-modal'));
                    } else {
                        throw new Error('Failed to load case');
                    }
                } catch (error) {
                    this.showToast('Error loading case details: ' + error.message, 'error');
                    console.error('Error loading case:', error);
                }
            }

            updateEditFormForPermissions(caseItem) {
                console.log('updateEditFormForPermissions called for case:', caseItem);
                console.log('Current user:', this.currentUser);
                console.log('User permissions:', this.userPermissions);
                console.log('Has update_status permission:', this.hasPermission('update_status'));
                
                // Remove any existing status field first
                const existingStatusField = document.getElementById('case-status');
                if (existingStatusField) {
                    existingStatusField.closest('.form-group').remove();
                }

                // Add status field if user can update status
                if (this.hasPermission('update_status')) {
                    console.log('Adding status dropdown to edit form');
                    const formRow = document.querySelector('.form-row');
                    
                    if (formRow && this.workflowInfo) {
                        // Get valid next statuses from workflow info
                        const currentStatus = caseItem.status;
                        let validNextStatuses = [];
                        
                        if (currentStatus === 'Hold') {
                            // For Hold status, get dynamic transitions based on previous status
                            if (caseItem.previousStatus) {
                                const allowedFromPrevious = this.workflowInfo.statuses[caseItem.previousStatus] || [];
                                validNextStatuses = [caseItem.previousStatus, ...allowedFromPrevious];
                            } else {
                                validNextStatuses = ['Assigned', 'In Progress'];
                            }
                        } else {
                            validNextStatuses = this.workflowInfo.statuses[currentStatus] || [];
                        }
                        
                        console.log(`Current status: ${currentStatus}, Valid next statuses:`, validNextStatuses);
                        
                        // Create status field with only valid next statuses
                        const statusGroup = document.createElement('div');
                        statusGroup.className = 'form-group';
                        
                        let options = `<option value="${currentStatus}" selected>${currentStatus} (Current)</option>`;
                        validNextStatuses.forEach(status => {
                            if (status !== currentStatus) {  // Don't duplicate current status
                                options += `<option value="${status}">${status}</option>`;
                            }
                        });
                        
                        statusGroup.innerHTML = `
                            <label for="case-status">Status</label>
                            <select id="case-status">
                                ${options}
                            </select>
                        `;
                        
                        // Insert before the existing form row
                        formRow.parentNode.insertBefore(statusGroup, formRow);
                        console.log('Status dropdown added successfully');
                    }
                } else {
                    console.log('User does not have update_status permission, status dropdown not added');
                }
            }

            async deleteCase(caseId) {
                if (!this.hasPermission('delete')) {
                    this.showToast('You do not have permission to delete cases', 'error');
                    return;
                }

                if (!confirm('Are you sure you want to delete this case?')) {
                    return;
                }

                try {
                    const response = await this.makeAuthenticatedRequest(`/api/cases/${caseId}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        this.showToast('Case deleted successfully', 'success');
                        this.loadCases();
                    } else {
                        throw new Error('Failed to delete case');
                    }
                } catch (error) {
                    this.showToast('Error deleting case: ' + error.message, 'error');
                    console.error('Error deleting case:', error);
                }
            }

            async viewCaseDetails(caseId) {
                try {
                    const response = await this.makeAuthenticatedRequest(`/api/cases/${caseId}`);
                    
                    if (response.ok) {
                        const caseItem = await response.json();
                        this.renderCaseDetails(caseItem);
                        this.showModal(document.getElementById('details-modal'));
                    } else {
                        throw new Error('Failed to load case details');
                    }
                } catch (error) {
                    this.showToast('Error loading case details: ' + error.message, 'error');
                    console.error('Error loading case details:', error);
                }
            }

            renderCaseDetails(caseItem) {
                const formattedCreated = new Date(caseItem.createdAt).toLocaleString();
                const formattedUpdated = new Date(caseItem.updatedAt).toLocaleString();
                const statusClass = caseItem.status.toLowerCase().replace(/\s+/g, '-');
                const priorityClass = caseItem.priority.toLowerCase();

                const detailsContainer = document.getElementById('case-details');
                detailsContainer.innerHTML = `
                    <div class="case-details-content">
                        <div class="details-header">
                            <div class="details-title">${this.escapeHtml(caseItem.title)}</div>
                            <div class="case-id">Case #${caseItem.id}</div>
                        </div>
                        
                        <div class="details-meta">
                            <div class="meta-item">
                                <div class="meta-label">Status</div>
                                <div class="meta-value">
                                    <span class="status-badge status-${statusClass}">${caseItem.status}</span>
                                </div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">Priority</div>
                                <div class="meta-value">
                                    <span class="priority-badge priority-${priorityClass}">${caseItem.priority}</span>
                                </div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">Assigned To</div>
                                <div class="meta-value">${this.escapeHtml(caseItem.assignedTo)}</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">Created</div>
                                <div class="meta-value">${formattedCreated}</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">Last Updated</div>
                                <div class="meta-value">${formattedUpdated}</div>
                            </div>
                        </div>

                        <div class="meta-item">
                            <div class="meta-label">Description</div>
                            <div class="meta-value">${this.escapeHtml(caseItem.description)}</div>
                        </div>

                        <div class="comments-section">
                            <h4>Comments (${caseItem.comments.length})</h4>
                            <div class="comments-list">
                                ${caseItem.comments.map(comment => this.createCommentHtml(comment)).join('')}
                            </div>
                            
                            <div class="add-comment">
                                <textarea id="new-comment-text" placeholder="Add a comment..."></textarea>
                                <button class="btn-primary" onclick="app.addComment(${caseItem.id})">Add Comment</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            createCommentHtml(comment) {
                const formattedTime = new Date(comment.timestamp).toLocaleString();
                return `
                    <div class="comment">
                        <div class="comment-header">
                            <span class="comment-author">${this.escapeHtml(comment.author)}</span>
                            <span class="comment-time">${formattedTime}</span>
                        </div>
                        <div class="comment-text">${this.escapeHtml(comment.text)}</div>
                    </div>
                `;
            }

            async addComment(caseId) {
                const commentText = document.getElementById('new-comment-text').value.trim();
                if (!commentText) {
                    this.showToast('Please enter a comment', 'error');
                    return;
                }

                try {
                    const response = await this.makeAuthenticatedRequest(`/api/cases/${caseId}/comments`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            text: commentText
                        })
                    });

                    if (response.ok) {
                        this.showToast('Comment added successfully', 'success');
                        document.getElementById('new-comment-text').value = '';
                        this.viewCaseDetails(caseId);
                    } else {
                        throw new Error('Failed to add comment');
                    }
                } catch (error) {
                    this.showToast('Error adding comment: ' + error.message, 'error');
                    console.error('Error adding comment:', error);
                }
            }

            async submitCaseForm() {
                const title = document.getElementById('case-title').value.trim();
                const description = document.getElementById('case-description').value.trim();
                const priority = document.getElementById('case-priority').value;
                const assignedTo = document.getElementById('case-assignee').value;
                
                // Get status if dropdown exists (for users with update_status permission)
                const statusField = document.getElementById('case-status');
                const status = statusField ? statusField.value : undefined;

                if (!title || !description) {
                    this.showToast('Please fill in all required fields', 'error');
                    return;
                }

                const caseData = {
                    title,
                    description,
                    priority,
                    assignedTo
                };
                
                // Only include status if user can update it and a value was selected
                if (status && this.hasPermission('update_status')) {
                    caseData.status = status;
                    console.log('Including status in update:', status);
                }

                try {
                    let response;
                    if (this.currentEditingCase) {
                        response = await this.makeAuthenticatedRequest(`/api/cases/${this.currentEditingCase.id}`, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(caseData)
                        });
                    } else {
                        response = await this.makeAuthenticatedRequest('/api/cases', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(caseData)
                        });
                    }

                    if (response.ok) {
                        const updatedCase = await response.json();
                        const message = this.currentEditingCase ? 'Case updated successfully' : 'Case created successfully';
                        this.showToast(message, 'success');
                        this.closeModal(document.getElementById('case-modal'));
                        this.loadCases();
                        
                        // If details modal is open for the updated case, refresh it
                        const detailsModal = document.getElementById('details-modal');
                        if (this.currentEditingCase && !detailsModal.classList.contains('hidden')) {
                            this.showCaseDetails(updatedCase || this.currentEditingCase);
                        }
                    } else {
                        const errorData = await response.json();
                        throw new Error(errorData.error || 'Failed to save case');
                    }
                } catch (error) {
                    this.showToast(`Error saving case: ${error.message}`, 'error');
                    console.error('Error saving case:', error);
                }
            }

            showModal(modal) {
                modal.classList.remove('hidden');
                modal.classList.add('show');
                document.body.style.overflow = 'hidden';
            }

            closeModal(modal) {
                modal.classList.remove('show');
                modal.classList.add('hidden');
                document.body.style.overflow = '';
            }

            showLoading(show) {
                const loading = document.getElementById('loading');
                if (loading) {
                    if (show) {
                        loading.classList.remove('hidden');
                    } else {
                        loading.classList.add('hidden');
                    }
                }
            }

            showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = message;

                let container = document.getElementById('toast-container');
                if (!container) {
                    container = document.createElement('div');
                    container.id = 'toast-container';
                    container.style.cssText = 'position: fixed; top: 20px; right: 20px; z-index: 1100;';
                    document.body.appendChild(container);
                }
                container.appendChild(toast);

                setTimeout(() => {
                    toast.remove();
                }, 3000);
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // User Management Methods
            showUserManagement() {
                if (!this.currentUser || (this.currentUser.role !== 'admin' && this.currentUser.role !== 'ADMIN')) {
                    this.showToast('You do not have permission to manage users', 'error');
                    return;
                }
                
                this.loadAndDisplayUsers();
                this.showModal(document.getElementById('user-modal'));
            }

            async loadAndDisplayUsers() {
                const usersList = document.getElementById('users-list');
                usersList.innerHTML = '<div class="loading">Loading users...</div>';
                
                try {
                    const users = await this.loadUsers();
                    this.displayUsersList(users);
                } catch (error) {
                    usersList.innerHTML = '<div class="error">Failed to load users</div>';
                }
            }

            async loadUsers() {
                try {
                    const response = await this.makeAuthenticatedRequest('/api/users');
                    if (response.ok) {
                        this.allUsers = await response.json();
                        this.updateUserDropdowns();
                        return this.allUsers;
                    }
                } catch (error) {
                    console.error('Error loading users:', error);
                    this.showToast('Failed to load users', 'error');
                }
                return [];
            }

            updateUserDropdowns() {
                console.log('Updating user dropdowns with users:', this.allUsers);
                
                // Update assignee filter dropdown
                const assigneeFilter = document.getElementById('assignee-filter');
                if (assigneeFilter && this.allUsers) {
                    const currentValue = assigneeFilter.value;
                    assigneeFilter.innerHTML = '<option value="All">All</option>';
                    
                    this.allUsers.forEach(user => {
                        const option = document.createElement('option');
                        option.value = user.username || user.name;
                        option.textContent = user.name || user.username;
                        assigneeFilter.appendChild(option);
                    });
                    
                    // Add unassigned option
                    const unassignedOption = document.createElement('option');
                    unassignedOption.value = 'Unassigned';
                    unassignedOption.textContent = 'Unassigned';
                    assigneeFilter.appendChild(unassignedOption);
                    
                    // Restore previous selection
                    assigneeFilter.value = currentValue;
                    console.log('Updated assignee filter dropdown with', this.allUsers.length, 'users');
                }

                // Update case form assignee dropdown
                const caseAssignee = document.getElementById('case-assignee');
                if (caseAssignee && this.allUsers) {
                    const currentValue = caseAssignee.value;
                    caseAssignee.innerHTML = '<option value="Unassigned">Unassigned</option>';
                    
                    this.allUsers.forEach(user => {
                        const option = document.createElement('option');
                        option.value = user.username || user.name;
                        option.textContent = user.name || user.username;
                        caseAssignee.appendChild(option);
                    });
                    
                    // Restore previous selection
                    caseAssignee.value = currentValue;
                    console.log('Updated case assignee dropdown with', this.allUsers.length, 'users');
                }
            }

            displayUsersList(users) {
                const usersList = document.getElementById('users-list');
                
                if (!users || users.length === 0) {
                    usersList.innerHTML = '<div class="no-data">No users found</div>';
                    return;
                }

                const usersHtml = users.map(user => `
                    <div class="user-item" data-user-id="${user.id}">
                        <div class="user-info">
                            <div class="user-name">${this.escapeHtml(user.name || user.username)}</div>
                            <div class="user-details">
                                <span class="user-username">@${this.escapeHtml(user.username)}</span>
                                <span class="user-role badge role-${user.role}">${user.role}</span>
                                <span class="user-email">${this.escapeHtml(user.email || 'No email')}</span>
                            </div>
                        </div>
                        <div class="user-actions">
                            <button class="btn-small btn-secondary edit-user-btn" data-user-id="${user.id}">Edit</button>
                            ${user.role !== 'admin' && user.role !== 'ADMIN' ? `<button class="btn-small btn-danger delete-user-btn" data-user-id="${user.id}">Delete</button>` : ''}
                        </div>
                    </div>
                `).join('');

                usersList.innerHTML = usersHtml;

                // Add event listeners for edit and delete buttons
                usersList.querySelectorAll('.edit-user-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const userId = e.target.dataset.userId;
                        this.editUser(userId);
                    });
                });

                usersList.querySelectorAll('.delete-user-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const userId = e.target.dataset.userId;
                        this.deleteUser(userId);
                    });
                });
            }

            async editUser(userId) {
                console.log('Editing user with ID:', userId);
                
                // Find the user in the current user list
                const user = this.allUsers.find(u => u.id == userId);
                if (!user) {
                    this.showToast('User not found', 'error');
                    return;
                }

                // Populate the user form with existing data
                document.getElementById('user-form-title').textContent = 'Edit User';
                document.getElementById('user-username').value = user.username;
                document.getElementById('user-name').value = user.name || '';
                document.getElementById('user-email').value = user.email || '';
                document.getElementById('user-role').value = user.role;
                document.getElementById('user-password').value = ''; // Don't show existing password
                document.getElementById('user-password').placeholder = 'Leave blank to keep current password';
                document.getElementById('user-password').required = false; // Password not required for edit
                
                // Set form mode and user ID
                document.getElementById('user-form').dataset.mode = 'edit';
                document.getElementById('user-form').dataset.userId = userId;
                
                // Show the user form modal
                this.showModal(document.getElementById('user-form-modal'));
            }

            async deleteUser(userId) {
                console.log('Deleting user with ID:', userId);
                
                // Find the user to get their name for confirmation
                const user = this.allUsers.find(u => u.id == userId);
                if (!user) {
                    this.showToast('User not found', 'error');
                    return;
                }

                // Prevent deleting admin users or self
                if (user.role === 'ADMIN' || user.role === 'admin') {
                    this.showToast('Cannot delete admin users', 'error');
                    return;
                }

                if (user.id == this.currentUser.id || userId == this.currentUser.id) {
                    this.showToast('Cannot delete your own account', 'error');
                    return;
                }

                // Confirm deletion
                if (!confirm(`Are you sure you want to delete user "${user.name || user.username}"?\n\nThis action cannot be undone.`)) {
                    return;
                }

                try {
                    const response = await this.makeAuthenticatedRequest(`/api/users/${userId}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        this.showToast('User deleted successfully', 'success');
                        // Refresh the user list
                        await this.loadAndDisplayUsers();
                        // Refresh dropdowns
                        await this.loadUsers();
                    } else {
                        const error = await response.json();
                        this.showToast(error.error || 'Failed to delete user', 'error');
                    }
                } catch (error) {
                    console.error('Error deleting user:', error);
                    this.showToast('Failed to delete user', 'error');
                }
            }

            async saveUser() {
                console.log('Saving user...');
                
                const form = document.getElementById('user-form');
                const mode = form.dataset.mode;
                const userId = form.dataset.userId;

                const userData = {
                    username: document.getElementById('user-username').value.trim(),
                    name: document.getElementById('user-name').value.trim(),
                    email: document.getElementById('user-email').value.trim(),
                    role: document.getElementById('user-role').value,
                    password: document.getElementById('user-password').value
                };

                // Validate required fields
                if (!userData.username || !userData.name || !userData.email || !userData.role) {
                    this.showToast('Please fill in all required fields', 'error');
                    return;
                }

                if (mode === 'create' && !userData.password) {
                    this.showToast('Password is required for new users', 'error');
                    return;
                }

                // Validate email format
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(userData.email)) {
                    this.showToast('Please enter a valid email address', 'error');
                    return;
                }

                try {
                    let url, method;
                    
                    if (mode === 'create') {
                        url = '/api/users';
                        method = 'POST';
                    } else {
                        url = `/api/users/${userId}`;
                        method = 'PUT';
                        // Don't send empty password for edits
                        if (!userData.password) {
                            delete userData.password;
                        }
                    }

                    const response = await this.makeAuthenticatedRequest(url, {
                        method: method,
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(userData)
                    });

                    if (response.ok) {
                        this.showToast(`User ${mode === 'create' ? 'created' : 'updated'} successfully`, 'success');
                        this.hideModal(document.getElementById('user-form-modal'));
                        // Refresh the user list
                        await this.loadAndDisplayUsers();
                        // Refresh dropdowns
                        await this.loadUsers();
                    } else {
                        const error = await response.json();
                        this.showToast(error.error || `Failed to ${mode} user`, 'error');
                    }
                } catch (error) {
                    console.error('Error saving user:', error);
                    this.showToast('Failed to save user', 'error');
                }
            }

            openNewUserModal() {
                console.log('Opening new user modal...');
                
                // Reset form for new user
                document.getElementById('user-form-title').textContent = 'Add New User';
                document.getElementById('user-form').reset();
                document.getElementById('user-password').placeholder = 'Enter password';
                document.getElementById('user-password').required = true; // Password required for new users
                
                // Set form mode
                document.getElementById('user-form').dataset.mode = 'create';
                delete document.getElementById('user-form').dataset.userId;
                
                // Show the user form modal
                this.showModal(document.getElementById('user-form-modal'));
            }

            showModal(modal) {
                if (modal) {
                    modal.classList.remove('hidden');
                    modal.classList.add('show');
                }
            }

            hideModal(modal) {
                if (modal) {
                    modal.classList.add('hidden');
                    modal.classList.remove('show');
                }
            }
        }

        // Initialize the app when the DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded, initializing app...');
            window.app = new CaseWorkflowApp();
            console.log('App initialized:', window.app);
        });
    </script>
        </div> <!-- End app-section -->
    </div>
</body>
